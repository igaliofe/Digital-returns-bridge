# Render Blueprint — Digital Returns Bridge
# New → Blueprint → pick repo. Provisions Postgres + WildFly web service.
#
# Manual steps NOT covered by this file:
#   1. Set sync:false Cloudinary vars below in the Render dashboard.
#      (DB connection is wired automatically from drb-db — no manual JDBC_URL.)
#   2. Load schema before first boot (Hibernate runs hbm2ddl validate):
#        psql "<EXTERNAL_DATABASE_URL>" -f database/schema.sql
#        psql "<EXTERNAL_DATABASE_URL>" -f database/seed.sql

databases:
  - name: drb-db
    plan: free

services:
  - type: web
    name: drb-server
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: .          # repo root — Dockerfile COPYs pom.xml, server/, infra/
    plan: starter             # WildFly heavy; 512MB free tier risks OOM on boot
    healthCheckPath: /digital-returns-bridge/login.xhtml
    envVars:
      - key: POSTGRES_USER
        fromDatabase:
          name: drb-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: drb-db
          property: password
      # DB connection assembled from these in configure-datasource.cli ->
      # jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}. No JDBC property exists
      # in Render, so build it from the parts it does expose.
      - key: DB_HOST
        fromDatabase:
          name: drb-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: drb-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: drb-db
          property: database
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false           # keep secret out of repo
