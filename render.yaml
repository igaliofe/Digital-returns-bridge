# Render Blueprint — Digital Returns Bridge
# New → Blueprint → pick repo. Provisions Postgres + WildFly web service.
#
# Manual steps NOT covered by this file:
#   1. Set sync:false vars below in the Render dashboard (JDBC_URL + Cloudinary).
#      JDBC_URL = jdbc:postgresql://<internal-host>:5432/<db>  (from drb-db internal URL)
#   2. Load schema before first boot (Hibernate runs hbm2ddl validate):
#        psql "<EXTERNAL_DATABASE_URL>" -f database/schema.sql
#        psql "<EXTERNAL_DATABASE_URL>" -f database/seed.sql

databases:
  - name: drb-db
    plan: free

services:
  - type: web
    name: drb-server
    runtime: docker
    dockerfilePath: server/Dockerfile
    dockerContext: .          # repo root — Dockerfile COPYs pom.xml, server/, infra/
    plan: starter             # WildFly heavy; 512MB free tier risks OOM on boot
    healthCheckPath: /digital-returns-bridge/login.xhtml
    envVars:
      - key: POSTGRES_USER
        fromDatabase:
          name: drb-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: drb-db
          property: password
      - key: JDBC_URL
        sync: false           # jdbc:postgresql://HOST:5432/DB — Render has no JDBC property
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false           # keep secret out of repo
