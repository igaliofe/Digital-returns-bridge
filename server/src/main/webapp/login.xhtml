<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <title>Login — Tollman&apos;s</title>
    <h:outputStylesheet name="css/drb.css"/>
</h:head>
<h:body>
    <div class="drb-login-page">
        <div class="drb-login-card">
            <div class="drb-login-brand">
                <div class="drb-login-logo">Tollman&apos;s</div>
                <div>
                    <p class="drb-login-app-tag">Reverse logistics platform</p>
                </div>
            </div>

            <h:form id="loginForm">
                <h2 class="drb-login-heading">Sign In</h2>
                <p class="drb-login-subheading">Service &amp; Manager Portal access</p>

                <p:messages id="msgs" showDetail="true" showSummary="false" closable="true"/>

                <label class="drb-field-label" for="phone">Phone Number</label>
                <p:inputText id="phone" value="#{loginBean.phoneNumber}"
                             placeholder="e.g. 0501234567" required="true"
                             requiredMessage="Phone number is required"
                             style="width:100%;margin-bottom:18px;"/>
                <p:message for="phone" display="text"/>

                <p:commandButton value="Sign In"
                                 action="#{loginBean.login}"
                                 styleClass="drb-btn-primary"
                                 style="width:100%;"
                                 update="msgs"/>

                <p class="drb-login-hint">Enter your registered phone number to receive portal access.</p>
            </h:form>
        </div>
    </div>
</h:body>
</html>
