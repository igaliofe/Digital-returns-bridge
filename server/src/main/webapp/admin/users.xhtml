<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
<h:head><title>Users Admin — Tollman's</title></h:head>
<h:body>
<ui:composition template="/WEB-INF/templates/layout.xhtml">
<ui:define name="content">

    <h1 class="drb-page-title">User Management</h1>

    <h:form id="usersForm">
        <p:messages showDetail="true" closable="true"/>

        <p:toolbar style="margin-bottom:8px;">
            <p:toolbarGroup>
                <p:commandButton value="New User" icon="pi pi-plus"
                                 action="#{userAdminBean.prepareCreate}"
                                 update="usersForm createDialog"
                                 oncomplete="PF('createUserDlg').show();"/>
            </p:toolbarGroup>
        </p:toolbar>

        <p:dataTable id="usersTable" value="#{userAdminBean.users}" var="u"
                     editable="true" editMode="row"
                     paginator="true" rows="20"
                     emptyMessage="No users found."
                     style="width:100%;">

            <f:facet name="header">Users</f:facet>

            <p:column headerText="ID" style="width:60px;">
                <h:outputText value="#{u.id}"/>
            </p:column>

            <p:column headerText="Full Name">
                <p:cellEditor>
                    <f:facet name="output"><h:outputText value="#{u.fullName}"/></f:facet>
                    <f:facet name="input">
                        <p:inputText value="#{u.fullName}" style="width:100%;"
                                     required="true" requiredMessage="יש להזין שם מלא"
                                     validatorMessage="שם מלא ארוך מדי (עד 120 תווים)">
                            <f:validateLength maximum="120"/>
                        </p:inputText>
                    </f:facet>
                </p:cellEditor>
            </p:column>

            <p:column headerText="Phone">
                <p:cellEditor>
                    <f:facet name="output"><h:outputText value="#{u.phoneNumber}"/></f:facet>
                    <f:facet name="input">
                        <p:inputText value="#{u.phoneNumber}" style="width:100%;"
                                     required="true" requiredMessage="יש להזין מספר טלפון"
                                     validatorMessage="מספר טלפון לא תקין (לדוגמה 0501234567)">
                            <f:validateRegex pattern="^0\d{8,9}$"/>
                        </p:inputText>
                    </f:facet>
                </p:cellEditor>
            </p:column>

            <p:column headerText="Role">
                <p:cellEditor>
                    <f:facet name="output"><h:outputText value="#{u.role.name()}"/></f:facet>
                    <f:facet name="input">
                        <p:selectOneMenu value="#{u.role}"
                                         required="true" requiredMessage="יש לבחור תפקיד">
                            <f:selectItems value="#{userAdminBean.roles}" var="r"
                                           itemLabel="#{r.name()}" itemValue="#{r}"/>
                        </p:selectOneMenu>
                    </f:facet>
                </p:cellEditor>
            </p:column>

            <p:column headerText="Active" style="width:80px;">
                <p:cellEditor>
                    <f:facet name="output">
                        <h:outputText value="#{u.active ? 'Yes' : 'No'}"/>
                    </f:facet>
                    <f:facet name="input">
                        <p:selectBooleanCheckbox value="#{u.active}"/>
                    </f:facet>
                </p:cellEditor>
            </p:column>

            <p:column headerText="Actions" style="width:100px;" exportable="false">
                <p:rowEditor editTitle="Edit" saveTitle="Save" cancelTitle="Cancel"/>
                <p:commandButton icon="pi pi-trash" title="Delete"
                                 action="#{userAdminBean.deleteUser(u.id)}"
                                 update="usersForm"
                                 styleClass="ui-button-danger"
                                 onclick="return confirm('Delete user #{u.fullName}?');"
                                 style="margin-left:4px;"/>
            </p:column>

            <p:ajax event="rowEdit" listener="#{userAdminBean.setSelected(event.object)}"
                    oncomplete="#{userAdminBean.saveSelected()}"
                    update="usersForm"/>
            <p:ajax event="rowEditInit" listener="#{userAdminBean.setSelected(event.object)}"/>
        </p:dataTable>
    </h:form>

    <!-- Create Dialog -->
    <p:dialog id="createDialog" header="Create New User" widgetVar="createUserDlg"
              modal="true" resizable="false" style="width:400px;">
        <h:form id="createUserForm">
            <p:panelGrid columns="2" style="width:100%;">
                <p:outputLabel for="newFullName" value="Full Name *"/>
                <h:panelGroup layout="block">
                    <p:inputText id="newFullName" value="#{userAdminBean.newUser.fullName}"
                                 required="true" requiredMessage="יש להזין שם מלא"
                                 validatorMessage="שם מלא ארוך מדי (עד 120 תווים)"
                                 style="width:100%;">
                        <f:validateLength maximum="120"/>
                    </p:inputText>
                    <p:message for="newFullName" display="text"/>
                </h:panelGroup>

                <p:outputLabel for="newPhone" value="Phone *"/>
                <h:panelGroup layout="block">
                    <p:inputText id="newPhone" value="#{userAdminBean.newUser.phoneNumber}"
                                 required="true" requiredMessage="יש להזין מספר טלפון"
                                 validatorMessage="מספר טלפון לא תקין (לדוגמה 0501234567)"
                                 style="width:100%;">
                        <f:validateRegex pattern="^0\d{8,9}$"/>
                    </p:inputText>
                    <p:message for="newPhone" display="text"/>
                </h:panelGroup>

                <p:outputLabel for="newRole" value="Role *"/>
                <h:panelGroup layout="block">
                    <p:selectOneMenu id="newRole" value="#{userAdminBean.newUser.role}"
                                     required="true" requiredMessage="יש לבחור תפקיד">
                        <f:selectItem itemLabel="— Select Role —" itemValue="#{null}"/>
                        <f:selectItems value="#{userAdminBean.roles}" var="r"
                                       itemLabel="#{r.name()}" itemValue="#{r}"/>
                    </p:selectOneMenu>
                    <p:message for="newRole" display="text"/>
                </h:panelGroup>

                <p:outputLabel for="newActive" value="Active"/>
                <p:selectBooleanCheckbox id="newActive" value="#{userAdminBean.newUser.active}"/>
            </p:panelGrid>
            <div style="margin-top:12px;text-align:right;">
                <!-- Never update createDialog here: re-rendering the dialog re-emits it hidden,
                     so a failed validation would close it instead of showing the messages.
                     Updating createUserForm alone re-renders the p:message text in place. -->
                <p:commandButton value="Save"
                                 action="#{userAdminBean.saveNew}"
                                 icon="pi pi-save"
                                 update="usersForm createUserForm"
                                 oncomplete="if (!args.validationFailed) PF('createUserDlg').hide();"/>
                <p:commandButton value="Cancel"
                                 onclick="PF('createUserDlg').hide(); return false;"
                                 type="button"
                                 styleClass="ui-button-secondary"
                                 style="margin-left:6px;"/>
            </div>
        </h:form>
    </p:dialog>

</ui:define>
</ui:composition>
</h:body>
</html>
