<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
<h:head><title>Products Admin — Tollman's</title></h:head>
<h:body>
<ui:composition template="/WEB-INF/templates/layout.xhtml">
<ui:define name="content">

    <h1 class="drb-page-title">Product Management</h1>

    <h:form id="productsForm">
        <p:messages showDetail="true" closable="true"/>

        <p:toolbar style="margin-bottom:8px;">
            <p:toolbarGroup>
                <p:commandButton value="New Product" icon="pi pi-plus"
                                 action="#{productAdminBean.prepareCreate}"
                                 update="productsForm createDialog"
                                 oncomplete="PF('createProductDlg').show();"/>
            </p:toolbarGroup>
        </p:toolbar>

        <p:dataTable id="productsTable" value="#{productAdminBean.products}" var="prod"
                     editable="true" editMode="row"
                     paginator="true" rows="20"
                     emptyMessage="No products found."
                     style="width:100%;">

            <p:column headerText="ID" style="width:60px;">
                <h:outputText value="#{prod.id}"/>
            </p:column>

            <p:column headerText="Image" style="width:80px;">
                <p:graphicImage value="#{prod.imageUrl}"
                                rendered="#{not empty prod.imageUrl}"
                                style="width:56px;height:56px;object-fit:cover;border-radius:4px;"/>
            </p:column>

            <p:column headerText="Image URL">
                <p:cellEditor>
                    <f:facet name="output"><h:outputText value="#{prod.imageUrl}"/></f:facet>
                    <f:facet name="input">
                        <p:inputText value="#{prod.imageUrl}" style="width:100%;"
                                     validatorMessage="כתובת התמונה ארוכה מדי (עד 500 תווים)">
                            <f:validateLength maximum="500"/>
                        </p:inputText>
                    </f:facet>
                </p:cellEditor>
            </p:column>

            <p:column headerText="SKU">
                <p:cellEditor>
                    <f:facet name="output"><h:outputText value="#{prod.sku}"/></f:facet>
                    <f:facet name="input">
                        <p:inputText value="#{prod.sku}" style="width:100%;"
                                     required="true" requiredMessage="יש להזין SKU"
                                     validatorMessage="SKU ארוך מדי (עד 60 תווים)">
                            <f:validateLength maximum="60"/>
                        </p:inputText>
                    </f:facet>
                </p:cellEditor>
            </p:column>

            <p:column headerText="Name">
                <p:cellEditor>
                    <f:facet name="output"><h:outputText value="#{prod.name}"/></f:facet>
                    <f:facet name="input">
                        <p:inputText value="#{prod.name}" style="width:100%;"
                                     required="true" requiredMessage="יש להזין שם מוצר"
                                     validatorMessage="שם המוצר ארוך מדי (עד 120 תווים)">
                            <f:validateLength maximum="120"/>
                        </p:inputText>
                    </f:facet>
                </p:cellEditor>
            </p:column>

            <p:column headerText="Category">
                <p:cellEditor>
                    <f:facet name="output"><h:outputText value="#{prod.category}"/></f:facet>
                    <f:facet name="input">
                        <p:inputText value="#{prod.category}" style="width:100%;"
                                     validatorMessage="הקטגוריה ארוכה מדי (עד 80 תווים)">
                            <f:validateLength maximum="80"/>
                        </p:inputText>
                    </f:facet>
                </p:cellEditor>
            </p:column>

            <p:column headerText="Price">
                <p:cellEditor>
                    <f:facet name="output">
                        <h:outputText value="#{prod.price}">
                            <f:convertNumber type="currency" currencySymbol="₪"/>
                        </h:outputText>
                    </f:facet>
                    <f:facet name="input">
                        <p:inputText value="#{prod.price}" style="width:100%;"
                                     validatorMessage="המחיר חייב להיות מספר לא שלילי">
                            <f:validateDoubleRange minimum="0"/>
                        </p:inputText>
                    </f:facet>
                </p:cellEditor>
            </p:column>

            <p:column headerText="Actions" style="width:100px;" exportable="false">
                <p:rowEditor editTitle="Edit" saveTitle="Save" cancelTitle="Cancel"/>
                <p:commandButton icon="pi pi-trash" title="Delete"
                                 action="#{productAdminBean.deleteProduct(prod.id)}"
                                 update="productsForm"
                                 styleClass="ui-button-danger"
                                 onclick="return confirm('Delete product #{prod.name}?');"
                                 style="margin-left:4px;"/>
            </p:column>

            <p:ajax event="rowEdit" listener="#{productAdminBean.setSelected(event.object)}"
                    oncomplete="#{productAdminBean.saveSelected()}"
                    update="productsForm"/>
            <p:ajax event="rowEditInit" listener="#{productAdminBean.setSelected(event.object)}"/>
        </p:dataTable>
    </h:form>

    <!-- Create Dialog -->
    <p:dialog id="createDialog" header="Create New Product" widgetVar="createProductDlg"
              modal="true" resizable="false" style="width:400px;">
        <h:form id="createProductForm" enctype="multipart/form-data">
            <p:panelGrid columns="2" style="width:100%;">
                <p:outputLabel for="newSku" value="SKU *"/>
                <h:panelGroup layout="block">
                    <p:inputText id="newSku" value="#{productAdminBean.newProduct.sku}"
                                 required="true" requiredMessage="יש להזין SKU"
                                 validatorMessage="SKU ארוך מדי (עד 60 תווים)"
                                 style="width:100%;">
                        <f:validateLength maximum="60"/>
                    </p:inputText>
                    <p:message for="newSku" display="text"/>
                </h:panelGroup>

                <p:outputLabel for="newName" value="Name *"/>
                <h:panelGroup layout="block">
                    <p:inputText id="newName" value="#{productAdminBean.newProduct.name}"
                                 required="true" requiredMessage="יש להזין שם מוצר"
                                 validatorMessage="שם המוצר ארוך מדי (עד 120 תווים)"
                                 style="width:100%;">
                        <f:validateLength maximum="120"/>
                    </p:inputText>
                    <p:message for="newName" display="text"/>
                </h:panelGroup>

                <p:outputLabel for="newCategory" value="Category"/>
                <h:panelGroup layout="block">
                    <p:inputText id="newCategory" value="#{productAdminBean.newProduct.category}"
                                 validatorMessage="הקטגוריה ארוכה מדי (עד 80 תווים)"
                                 style="width:100%;">
                        <f:validateLength maximum="80"/>
                    </p:inputText>
                    <p:message for="newCategory" display="text"/>
                </h:panelGroup>

                <p:outputLabel for="newDesc" value="Description"/>
                <p:inputTextarea id="newDesc" value="#{productAdminBean.newProduct.description}"
                                 rows="3" style="width:100%;"/>

                <p:outputLabel for="newPrice" value="Price"/>
                <h:panelGroup layout="block">
                    <p:inputText id="newPrice" value="#{productAdminBean.newProduct.price}"
                                 validatorMessage="המחיר חייב להיות מספר לא שלילי"
                                 style="width:100%;">
                        <f:validateDoubleRange minimum="0"/>
                    </p:inputText>
                    <p:message for="newPrice" display="text"/>
                </h:panelGroup>

                <p:outputLabel for="newImageUrl" value="Image URL"/>
                <h:panelGroup layout="block">
                    <p:inputText id="newImageUrl" value="#{productAdminBean.newProduct.imageUrl}"
                                 placeholder="https://..."
                                 validatorMessage="כתובת התמונה ארוכה מדי (עד 500 תווים)"
                                 style="width:100%;">
                        <f:validateLength maximum="500"/>
                    </p:inputText>
                    <p:message for="newImageUrl" display="text"/>
                </h:panelGroup>

                <p:outputLabel for="newImageFile" value="Or Upload Image"/>
                <h:inputFile id="newImageFile" value="#{productAdminBean.uploadedImage}"
                             accept="image/*" style="width:100%;"/>
            </p:panelGrid>
            <div style="margin-top:12px;text-align:right;">
                <!-- Never update createDialog here: re-rendering the dialog re-emits it hidden,
                     so a failed validation would close it instead of showing the messages.
                     Updating createProductForm alone re-renders the p:message text in place. -->
                <p:commandButton value="Save"
                                 action="#{productAdminBean.saveNew}"
                                 icon="pi pi-save"
                                 update="productsForm createProductForm"
                                 oncomplete="if (!args.validationFailed) PF('createProductDlg').hide();"/>
                <p:commandButton value="Cancel"
                                 onclick="PF('createProductDlg').hide(); return false;"
                                 type="button"
                                 styleClass="ui-button-secondary"
                                 style="margin-left:6px;"/>
            </div>
        </h:form>
    </p:dialog>

</ui:define>
</ui:composition>
</h:body>
</html>
