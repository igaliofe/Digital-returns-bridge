<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui">
<h:head><title>Dashboard — Digital Returns Bridge</title></h:head>
<h:body>
<ui:composition template="/WEB-INF/templates/layout.xhtml">
<ui:define name="content">

    <h2 style="margin-bottom:16px;">Dashboard</h2>

    <p:panelGrid columns="4" style="width:100%;margin-bottom:24px;"
                 columnClasses="ui-panelgrid-col,ui-panelgrid-col,ui-panelgrid-col,ui-panelgrid-col">
        <p:outputLabel value="Open"/>
        <p:outputLabel value="#{dashboardBean.get('totalOpen')}"
                       style="font-size:24px;font-weight:bold;color:#2196F3;"/>
        <p:outputLabel value="Waiting Pickup"/>
        <p:outputLabel value="#{dashboardBean.get('totalWaitingPickup')}"
                       style="font-size:24px;font-weight:bold;color:#FF9800;"/>

        <p:outputLabel value="Barcode Assigned"/>
        <p:outputLabel value="#{dashboardBean.get('totalBarcodeAssigned')}"
                       style="font-size:24px;font-weight:bold;color:#9C27B0;"/>
        <p:outputLabel value="Picked Up"/>
        <p:outputLabel value="#{dashboardBean.get('totalPickedUp')}"
                       style="font-size:24px;font-weight:bold;color:#00BCD4;"/>

        <p:outputLabel value="In Warehouse"/>
        <p:outputLabel value="#{dashboardBean.get('totalInWarehouse')}"
                       style="font-size:24px;font-weight:bold;color:#607D8B;"/>
        <p:outputLabel value="Closed"/>
        <p:outputLabel value="#{dashboardBean.get('totalClosed')}"
                       style="font-size:24px;font-weight:bold;color:#4CAF50;"/>

        <p:outputLabel value="Needs More Info"/>
        <p:outputLabel value="#{dashboardBean.get('totalNeedsMoreInfo')}"
                       style="font-size:24px;font-weight:bold;color:#FF5722;"/>
        <p:outputLabel value="No Barcode Assigned" style="font-weight:bold;"/>
        <p:outputLabel value="#{dashboardBean.get('noBarcode')}"
                       style="font-size:24px;font-weight:bold;color:#F44336;"/>
    </p:panelGrid>

    <p:button value="New Return" icon="pi pi-plus"
              href="#{request.contextPath}/returns/create.xhtml"
              rendered="#{sessionScope.loggedInUser.role.name() == 'SERVICE_REP' or sessionScope.loggedInUser.role.name() == 'MANAGER'}"/>
    <p:button value="View All Returns" icon="pi pi-list"
              href="#{request.contextPath}/returns/list.xhtml"
              styleClass="ui-button-secondary"
              style="margin-left:8px;"/>

</ui:define>
</ui:composition>
</h:body>
</html>
