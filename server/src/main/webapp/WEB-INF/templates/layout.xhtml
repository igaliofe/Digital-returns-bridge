<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:ui="jakarta.faces.facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:c="http://java.sun.com/jsp/jstl/core">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Tollman&apos;s</title>
    <h:outputStylesheet name="css/drb.css"/>
    <!-- Load after PrimeFaces saga theme (injected by PF components) -->
    <style type="text/css">
        html, body.drb-body, body.drb-body .drb-content {
            background-color: #faf5ec !important;
        }
    </style>
</h:head>
<h:body class="drb-body">
    <c:set var="viewId" value="#{facesContext.viewRoot.viewId}"/>
    <c:set var="cp" value="#{request.contextPath}"/>

    <header class="drb-header">
        <div class="drb-header-inner">
            <div class="drb-logo-wrap">
                <h:outputLink value="#{cp}/dashboard.xhtml" styleClass="drb-logo">Tollman&apos;s</h:outputLink>
            </div>

            <nav class="drb-nav">
                <h:outputLink value="#{cp}/dashboard.xhtml"
                              styleClass="#{viewId.contains('dashboard') ? 'drb-nav-active' : ''}">Dashboard</h:outputLink>

                <h:outputLink value="#{cp}/returns/list.xhtml"
                              styleClass="#{viewId.contains('/returns/list') or viewId.contains('/returns/details') ? 'drb-nav-active' : ''}">Returns</h:outputLink>

                <h:outputLink value="#{cp}/returns/create.xhtml"
                              styleClass="#{viewId.contains('/returns/create') ? 'drb-nav-active' : ''}">New Return</h:outputLink>

                <h:outputLink value="#{cp}/warehouse/receiving.xhtml"
                              styleClass="#{viewId.contains('warehouse') ? 'drb-nav-active' : ''}">Warehouse</h:outputLink>

                <h:outputLink value="#{cp}/reports.xhtml"
                              styleClass="#{viewId.contains('reports') ? 'drb-nav-active' : ''}">Reports</h:outputLink>

                <div class="drb-admin-dropdown">
                    <h:outputLink value="#{cp}/admin/users.xhtml"
                                  styleClass="#{viewId.contains('admin') ? 'drb-nav-active' : ''}">Admin ▾</h:outputLink>
                    <div class="drb-admin-menu">
                        <h:outputLink value="#{cp}/admin/users.xhtml">Users</h:outputLink>
                        <h:outputLink value="#{cp}/admin/customers.xhtml">Customers</h:outputLink>
                        <h:outputLink value="#{cp}/admin/products.xhtml">Products</h:outputLink>
                        <h:outputLink value="#{cp}/admin/drivers.xhtml">Drivers</h:outputLink>
                    </div>
                </div>
            </nav>

            <div class="drb-nav-spacer"/>

            <div class="drb-header-actions">
                <h:form style="display:inline;">
                    <h:commandLink action="#{loginBean.logout}" styleClass="drb-logout-link" value="Logout"/>
                </h:form>
                <span class="drb-avatar">
                    <h:outputText value="#{sessionScope.loggedInUser.fullName != null and sessionScope.loggedInUser.fullName.length() >= 2 ? sessionScope.loggedInUser.fullName.substring(0,2) : 'TO'}"/>
                </span>
            </div>
        </div>
    </header>

    <main class="drb-content">
        <p:messages showDetail="true" showSummary="false" closable="true"/>
        <ui:insert name="content"/>
    </main>
</h:body>
</html>
